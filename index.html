<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フィッシングメール鑑定所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flash" id="flash"></div>
<div id="app">

<!-- ===== スタート画面 ===== -->
<section class="scr" id="start">
  <h1>フィッシングメール<br>鑑定所</h1>
  <p class="tag">10通を秒で仕分けろ！</p>
  <div class="box">
    <p>あなたは「みなと商事」の社員。会社のアドレスは <span class="dom">@minato-shoji.example</span></p>
    <div class="two">
      <div style="background:var(--ng)">← 危険<small>左スワイプ</small></div>
      <div style="background:var(--ok)">返信OK →<small>右スワイプ</small></div>
    </div>
    <p>1通5秒以内。<b>合計タイム</b>で勝負。ミスは＋3秒、時間切れは＋5秒。上司が見てます。</p>
    <p class="note" style="margin:0">PCは←→キーでも操作できます。登場する会社・人物・アドレスはすべて架空です。</p>
  </div>
  <button class="big-btn" id="go">鑑定スタート</button>
  <div class="box" style="margin-top:18px">
    <h2>ランキング</h2>
    <p class="note" id="rankNoteTop"></p>
    <ol id="listTop"></ol>
  </div>
</section>

<!-- ===== プレイ画面 ===== -->
<section class="scr" id="play" hidden>
  <div class="hud">
    <div class="tm"><small>TIME</small><b id="clock">0.0</b></div>
    <div class="pg" id="pg">1 / 10</div>
    <button class="mute" id="mute">音 ON</button>
  </div>
  <div class="bossMini" id="bossMini"></div>
  <div class="combo" id="combo"></div>
  <div class="stage" id="stage"></div>
  <div class="limit"><i id="lim"></i></div>
  <div class="btns">
    <button class="ng" id="bNg">← 危険</button>
    <button class="ok" id="bOk">返信OK →</button>
  </div>
  <p class="hint">カードを左右にスワイプしてもOK</p>
  <div class="fx" id="fx"></div>
</section>

<!-- ===== 結果画面 ===== -->
<section class="scr" id="result" hidden>
  <div class="res-top"><div id="bossEnd"></div><div class="say" id="say"></div></div>
  <div class="score">
    <div class="g" id="grade">S</div>
    <div class="t"><span id="total">0.0</span>秒</div>
    <p id="detail"></p>
  </div>
  <div class="box">
    <form class="row" id="nameForm">
      <input id="name" maxlength="12" placeholder="ニックネームでランキングへ" autocomplete="nickname" required>
      <button class="sbtn" type="submit">登録</button>
    </form>
    <h2 style="margin-top:14px">ランキング</h2>
    <p class="note" id="rankNote"></p>
    <ol id="list"></ol>
  </div>
  <div class="row" style="margin-bottom:14px">
    <button class="sbtn" id="again" style="flex:1">もう一回</button>
    <button class="sbtn gh" id="copy" style="flex:1">結果をコピー</button>
  </div>
  <div class="box">
    <h2>答え合わせ</h2>
    <p class="note">間違えたメールが上に来ています。</p>
    <div id="review"></div>
  </div>
</section>

</div>
<div class="bossBig" id="bossBig" hidden></div>
<div class="cd" id="cd" hidden></div>

<!-- mails.js（問題）を先に読み込んでから、game.js（ゲームの動き）を読み込む -->
<script src="mails.js"></script>
<script src="game.js"></script>
</body>
</html>
